DATASET:
  TRAIN: "dataset/wholebody34/train.txt"
  VAL: "dataset/wholebody34/val.txt"
  NAMES: "configs/uhd09.names"
MODEL:
  INPUT_WIDTH: 64
  INPUT_HEIGHT: 64
TRAIN:
  LR: 0.00030
  WARMUP: true
  BATCH_SIZE: 64
  END_EPOCH: 300
  OPTIMIZER: adamw
  WEIGHT_DECAY: 0.0001
  SCHEDULER: cosine
  MIN_LR: 0.0
  T_MAX: 300
  CLASSES: 7,8,9,10,11,12,13,14,15
RENDER:
  # Only the label names corresponding to the listed class IDs will be drawn.
  LABEL_IDS: 8,9,10,11,12,13,14,15
  # Only scores corresponding to the listed class IDs will be plotted.
  SCORE_IDS:
  PRIORITY_RULES:
    - parent: 7
      children: 8,9,10,11,12,13,14,15
      iou: 0.9
      # If set to true, children that do not match the parent will not be drawn.
      require_parent_match: true
      # If set to true, the child's bbox will be drawn in the parent's coordinates if the parent-child IoU is greater than or equal to the threshold.
      use_parent_box: true
